name: kernel tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: install x402 test dependencies
        working-directory: demo/x402
        run: npm ci
      - name: kernel suite (no network, no wallet)
        shell: bash
        run: node --test test/*.test.js
